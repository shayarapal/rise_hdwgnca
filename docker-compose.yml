# Bind-mounts the SHARED_DIR host directory into both services at /shared, so dropping a
# .rds/.h5Seurat file into it on the host makes it visible at the same path in both
# containers — no `docker cp` or exec-into-container needed.
#
# SHARED_DIR lives OUTSIDE this repository (see .env / .env.example) because the datasets
# are 10-20 GB and must never enter git. It holds DATA_GSE233866/ and DATA_UNZIPPED/ with
# those exact names, because the R scripts address data as /shared/DATA_GSE233866/...
# Those directories carry the per-study analysis scripts too; neither is tracked here.
# The ./local_data fallback preserves the old in-repo behaviour when SHARED_DIR is unset.
services:
  r-service:
    build: ./src/r-service
    ports:
      - "8100:8100"
    volumes:
      - ${SHARED_DIR:-./local_data}:/shared
    environment:
      # WGCNA threads PER future worker (entrypoint.R runs 2), so this is a multiplier:
      # 2 x 4 = up to 8 extra R processes. Set to 1 to disable WGCNA's own parallelism.
      WGCNA_THREADS: "1"
    restart: unless-stopped

  backend:
    build: ./src/backend
    ports:
      - "8200:8200"
    volumes:
      - ${SHARED_DIR:-./local_data}:/shared
    environment:
      R_SERVICE_URL: http://r-service:8100
      PORT: "8200"
    depends_on:
      - r-service
    restart: unless-stopped

  # Frontend profile — excluded from default `docker compose up`
  # Enable with: docker compose --profile frontend up
  # nginx inside the container listens on 80; exposed as 4000 on the host
  react-ui:
    build: ./src/frontend
    ports:
      - "4000:80"
    profiles:
      - frontend

server {
    listen 80;

    # Serve the React SPA — fall back to index.html for any unknown path
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (Docker Compose service name)
    location ~ ^/(test-soft-powers|analyze|status|results)/ {
        proxy_pass         http://backend:8200;
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;  # hdWGCNA jobs can take several minutes
    }

    # Same for exact-match routes without trailing slash
    location ~ ^/(test-soft-powers|analyze)$ {
        proxy_pass         http://backend:8200;
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;
    }
}
